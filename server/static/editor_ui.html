<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yeeps Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --bg:#1d1915; --bg2:#262019; --card:#2d2720; --field:#211c17; --ink:#f1e8d9; --muted:#a8997f; --line:#453c31; --purple:#8c7bc9; --red:#e26a6a; --green:#45a386; --maroon:#c05a5a; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Quicksand', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--ink); font-size: 14px; }
  .app { display: flex; min-height: 100vh; }
  aside { width: 170px; flex-shrink: 0; background: var(--bg2); border-right: 1px solid var(--line);
          padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  aside button { background: var(--card); color: var(--ink); border: 1px solid var(--line); padding: 9px 12px;
                 border-radius: 6px; cursor: pointer; text-align: left; width: 100%; }
  aside button.on { background: var(--purple); color: #fff; border-color: var(--purple); }
  aside a { color: var(--purple); text-decoration: none; font-size: 13px; }
  .sp { flex: 1; }
  main { flex: 1; padding: 16px; max-width: 1000px; }
  .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  input[type=text] { background: var(--field); border: 1px solid var(--line); color: var(--ink);
                     padding: 7px 10px; border-radius: 6px; min-width: 220px; }
  textarea { width: 100%; height: 55vh; background: var(--field); border: 1px solid var(--line); color: var(--ink);
             font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
             padding: 10px; border-radius: 6px; }
  button.go { background: var(--purple); color: #fff; border: 0; padding: 8px 18px; border-radius: 6px;
              cursor: pointer; font-size: 14px; }
  button.del { background: var(--red); color: #fff; border: 0; padding: 5px 10px; border-radius: 6px;
               cursor: pointer; }
  button.blk { background: var(--maroon); color: #fff; border: 0; padding: 8px 14px; border-radius: 6px;
               cursor: pointer; font-size: 14px; }
  ul.list { list-style: none; margin: 0 0 10px; padding: 0; max-height: 220px; overflow: auto;
            border: 1px solid var(--line); border-radius: 6px; }
  ul.list li { padding: 7px 10px; border-bottom: 1px solid var(--card); cursor: pointer; }
  ul.list li:hover { background: var(--bg2); }
  ul.list li.bli { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: default; }
  ul.list li.bli:hover { background: transparent; }
  li.bli .binfo { min-width: 0; flex: 1 1 auto; }
  li.bli .bname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li.bli .bmeta { color: var(--muted); font-size: 11px; margin-top: 2px; word-break: break-word; }
  li.bli .kperm { color: var(--red); } li.bli .ktimed { color: #b8860b; } li.bli .kshadow { color: var(--purple); }
  li.bli button { flex: 0 0 auto; }
  #blist { max-height: 62vh; }
  .muted { color: var(--muted); }
  .note { color: var(--muted); margin: 0 0 10px; }
  #msg { position: fixed; bottom: 16px; right: 16px; background: var(--card); border: 1px solid var(--line);
         padding: 10px 14px; border-radius: 6px; display: none; max-width: 60vw; }
  table { border-collapse: collapse; font-size: 12px; }
  td, th { border: 1px solid var(--line); padding: 3px 7px; text-align: left; }
  details { margin-bottom: 8px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  summary { padding: 7px 10px; background: var(--bg2); cursor: pointer; font-weight: 600; }
  details ul.list { border: 0; border-top: 1px solid var(--line); border-radius: 0; max-height: 300px; }
  .has { color: var(--green); }
  table.errs { width: 100%; }
  table.errs td.msg { font-family: ui-monospace, Menlo, Consolas, monospace; word-break: break-word; cursor: pointer; }
  table.errs tr:hover td { background: var(--bg2); }
  .up { color: var(--red); } .down { color: var(--green); }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 60px; margin: 8px 0 12px; }
  .bars div { flex: 1; background: var(--purple); min-height: 1px; }
  .pgrp { margin: 0 0 10px; }
  .pgrp .muted { display: block; margin-bottom: 5px; font-size: 12px; }
  .pgrp button { background: var(--card); color: var(--ink); border: 1px solid var(--line); padding: 7px 11px;
                 border-radius: 6px; margin: 0 6px 6px 0; cursor: pointer; font-size: 13px; }
  .pgrp button:hover { border-color: var(--purple); }
  .pgrp button.off { color: var(--red); }
  pre.smp { background: var(--field); border: 1px solid var(--line); padding: 8px; border-radius: 6px;
            white-space: pre-wrap; word-break: break-word; font-size: 12px; margin: 4px 0 10px; }
  select { background: var(--field); border: 1px solid var(--line); color: var(--ink); padding: 6px 8px; border-radius: 6px; }
  input[type=number] { background: var(--field); border: 1px solid var(--line); color: var(--ink); padding: 6px 8px; border-radius: 6px; width: 90px; }
  .pwhit { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; cursor: default !important; }
  .pwhit .pwname { flex: 1 1 200px; min-width: 0; }
  .pwhit button { background: var(--card); color: var(--ink); border: 1px solid var(--line); padding: 6px 10px; border-radius: 6px; cursor: pointer; }
  .pwhit button:hover { border-color: var(--purple); }

  /* Phones: the side menu becomes a scrolling strip across the top, everything
     else goes full width, inputs are 16px so iOS doesn't zoom on tap. */
  @media (max-width: 720px) {
    body { font-size: 15px; }
    .app { flex-direction: column; }
    aside { width: 100%; flex-direction: row; align-items: center; overflow-x: auto; position: sticky;
            top: 0; z-index: 10; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; gap: 6px;
            -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    aside::-webkit-scrollbar { display: none; }
    aside button { width: auto; flex: 0 0 auto; white-space: nowrap; padding: 9px 13px; }
    aside .sp { display: none; }
    aside #who { white-space: nowrap; font-size: 12px; flex: 0 0 auto; }
    aside a { white-space: nowrap; flex: 0 0 auto; padding: 0 6px; }
    main { padding: 12px; max-width: 100%; min-width: 0; }
    .row { gap: 8px; }
    .row > input[type=text], .row > select { flex: 1 1 100%; }
    .row label { flex: 1 1 140px; }
    input[type=text], input[type=number], input[type=password], select, textarea { font-size: 16px; }
    main input[type=text], main select, main input[type=number] { min-width: 0 !important; max-width: 100%; }
    .row label input[type=text], .row label select { width: 100%; }
    textarea { height: 45vh; }
    button.go, button.blk, button.del { min-height: 40px; }
    ul.list li { padding: 11px 10px; }
    ul.list { max-height: 50vh; }
    li.bli { flex-wrap: wrap; }
    table { display: block; overflow-x: auto; max-width: 100%; }
    pre.smp, #pblog { font-size: 12px; }
    #msg { left: 12px; right: 12px; bottom: 12px; max-width: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <button data-t="players" class="on">Players</button>
    <button data-t="online">Online</button>
    <button data-t="banned">Banned</button>
    <button data-t="maps">Maps</button>
    <!--@cut photon-->    <button data-t="photon" id="tab-photon" style="display:none">Photon</button><!--@end photon-->
    <!--@cut talk-->    <button data-t="talk" id="tab-talk" style="display:none">Talk</button><!--@end talk-->
    <!--@cut liveview-->    <button data-t="liveview" id="tab-liveview" style="display:none">View</button><!--@end liveview-->
    <!--@cut roles-->    <button data-t="roles" id="tab-roles" style="display:none">Roles</button><!--@end roles-->
    <button data-t="extra">Extra</button>
    <span class="sp"></span>
    <a href="https://your-domain.example/" id="backbtn">Back to site</a>
    <span class="muted" id="who"></span>
    <a href="/editor/logout">Log out</a>
  </aside>
  <main id="view"></main>
</div>
<div id="msg"></div>

<script>
const API = "/editor/api";
const view = document.getElementById("view");

function toast(t, bad) {
  const m = document.getElementById("msg");
  m.textContent = t; m.style.borderColor = bad ? "#a33" : "#2a4"; m.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(() => m.style.display = "none", 3500);
}
let IS_MOD = false;     // admins + moderators: ban / unban / block
let IS_ADMIN = false;   // set from /api/me at init; gates admin-only player buttons
async function api(path, opts) {
  const r = await fetch(API + path, opts || {});
  if (r.status === 401) { location.href = "/editor/login"; throw new Error("auth"); }
  const txt = await r.text();
  let j; try { j = txt ? JSON.parse(txt) : {}; } catch { j = { raw: txt }; }
  if (!r.ok) throw new Error(j.detail || j.error || ("HTTP " + r.status));
  return j;
}
function pretty(o) { return JSON.stringify(o, null, 2); }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
// Parse a ban length like "2h", "3d", "1w", "30m". "" = permanent (0). null = invalid.
function parseDur(s) {
  s = (s || "").trim().toLowerCase();
  if (!s) return 0;
  const m = s.match(/^(\d+(?:\.\d+)?)\s*(m|min|mins|h|hr|hrs|hour|hours|d|day|days|w|wk|week|weeks)?$/);
  if (!m) return null;
  const n = parseFloat(m[1]), u = (m[2] || "h")[0];
  return u === "m" ? n / 60 : u === "d" ? n * 24 : u === "w" ? n * 168 : n;
}

// ---- room categories (folders) ----
function roomCat(k) {
  k = (k || "").toLowerCase();
  if (k.startsWith("official") || k.startsWith("researchfacility")) return "Public";
  if (k.startsWith("ch2")) return "Chapter 2";
  if (k.startsWith("wild")) return "Wilds";
  if (k.startsWith("bam")) return "BAM";
  // Private worlds are keyed p_o_<accountID>(_sandbox); community worlds c_<name>.
  if (k.startsWith("p_o_") || k.startsWith("pw")) return "Private Worlds (pw)";
  if (k.startsWith("c_") || k.startsWith("cw")) return "Community Worlds (cw)";
  if (k.startsWith("halloween") || k.startsWith("bonus") || k.startsWith("xmas")) return "Seasonal / Bonus";
  return "Other";
}
const CAT_ORDER = ["Public", "Chapter 2", "Wilds", "BAM", "Community Worlds (cw)", "Private Worlds (pw)", "Seasonal / Bonus", "Other"];
function folders(rows, itemHtml) {
  const g = {};
  rows.forEach(r => { const c = roomCat(r.roomKey); (g[c] = g[c] || []).push(r); });
  const cats = CAT_ORDER.filter(c => g[c]).concat(Object.keys(g).filter(c => !CAT_ORDER.includes(c)));
  return cats.map(c =>
    `<details><summary>${c} (${g[c].length})</summary><ul class="list">${g[c].map(itemHtml).join("")}</ul></details>`
  ).join("");
}

// ---- Players / Rooms / Default share a raw-JSON editor ----
function renderJsonEditor(opts) {
  // opts: {search(q), load(id)->obj, save(id,obj), label}
  view.innerHTML = `
    ${opts.search ? `<div class="row"><input type="text" id="q" placeholder="${opts.hint || "search " + opts.label + "..."}"><button class="go" id="sbtn">Search</button></div><ul class="list" id="list"></ul>` : ""}
    <p class="note" id="sel"></p>
    <textarea id="ed" placeholder="select ${opts.label} above"></textarea>
    <div class="row" style="margin-top:10px"><button class="go" id="save">Save</button>${opts.kick ? ` <button class="blk" id="kickrow">Kick</button>` : ""}${IS_ADMIN && opts.devreset ? ` <button class="blk" id="devrow">Reset headset lock</button>` : ""}${IS_ADMIN && opts.unlinkDiscord ? ` <button class="blk" id="unlinkrow">Unlink Discord</button>` : ""}${IS_MOD && opts.block ? ` <button class="blk" id="blockrow">Block</button>` : ""}${IS_ADMIN && opts.del ? ` <button class="del" id="delrow">Delete</button>` : ""}</div>`;
  const ed = document.getElementById("ed");
  const sel = document.getElementById("sel");
  let id = null, run = null, loaded = null;
  function updBlock() {
    const b = document.getElementById("blockrow");
    if (b) b.textContent = (loaded && (loaded.adminBlocked == 1 || loaded.adminBlocked === true)) ? "Unban" : "Ban (+ IP)";
    const u = document.getElementById("unlinkrow");
    if (u) {
      const link = loaded && (loaded.discordUsername || loaded.discordID);
      u.textContent = link ? ("Unlink Discord (" + link + ")") : "No Discord linked";
      u.disabled = !link; u.style.opacity = link ? "1" : "0.5";
    }
  }
  async function open(theId) {
    id = theId;
    try { loaded = await opts.load(theId); ed.value = pretty(loaded); sel.textContent = theId ? ("Editing: " + theId) : "Editing default"; updBlock(); }
    catch (e) { toast(e.message, true); }
  }
  if (opts.search) {
    run = async () => {
      try {
        const rows = await opts.search(document.getElementById("q").value.trim());
        const ul = document.getElementById("list");
        ul.innerHTML = rows.map(r => `<li data-id="${opts.id(r)}">${opts.row(r)}</li>`).join("") || "<li class='muted'>no results</li>";
        ul.querySelectorAll("li[data-id]").forEach(li => li.onclick = () => open(li.dataset.id));
      } catch (e) { toast(e.message, true); }
    };
    document.getElementById("sbtn").onclick = run;
    document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
    run();
  } else { open(null); }
  document.getElementById("save").onclick = async () => {
    let obj; try { obj = JSON.parse(ed.value); } catch (e) { return toast("Invalid JSON: " + e.message, true); }
    try { await opts.save(id, obj); toast("Saved."); } catch (e) { toast(e.message, true); }
  };
  const delBtn = document.getElementById("delrow");
  if (delBtn) delBtn.onclick = async () => {
    if (!id) return toast("Select one first", true);
    if (!confirm("Permanently delete " + id + "? This cannot be undone.")) return;
    try { await opts.del(id); toast("Deleted " + id); id = null; ed.value = ""; sel.textContent = ""; if (run) run(); }
    catch (e) { toast(e.message, true); }
  };
  const kickBtn = document.getElementById("kickrow");
  if (kickBtn) kickBtn.onclick = async () => {
    if (!id) return toast("Select a player first", true);
    const reason = prompt("Kick " + ((loaded && loaded.displayName) || id) + "? Optional reason (shown to them):", "");
    if (reason === null) return;
    try { await opts.kick(id, reason.trim()); toast("Kicked - lands within about a minute"); }
    catch (e) { toast(e.message, true); }
  };
  const devBtn = document.getElementById("devrow");
  if (devBtn) devBtn.onclick = async () => {
    if (!id) return toast("Select a player first", true);
    if (!confirm("Reset the headset lock for " + ((loaded && loaded.displayName) || id) + "? Their next login (from any headset) becomes their headset.")) return;
    try { await opts.devreset(id); toast("Headset lock reset - their next login sets the new headset"); }
    catch (e) { toast(e.message, true); }
  };
  const unlinkBtn = document.getElementById("unlinkrow");
  if (unlinkBtn) unlinkBtn.onclick = async () => {
    if (!id) return toast("Select a player first", true);
    const link = loaded && (loaded.discordUsername || loaded.discordID);
    if (!link) return toast("That account has no Discord linked", true);
    if (!confirm("Unlink Discord (" + link + ") from " + ((loaded && loaded.displayName) || id) + "?\nThey won't be able to join until they /link again.")) return;
    try { const r = await opts.unlinkDiscord(id); toast("Unlinked " + (r && r.unlinked || "")); await open(id); }
    catch (e) { toast(e.message, true); }
  };
  const blockBtn = document.getElementById("blockrow");
  if (blockBtn) blockBtn.onclick = async () => {
    if (!id) return toast("Select a player first", true);
    const isBlocked = loaded && (loaded.adminBlocked == 1 || loaded.adminBlocked === true);
    try {
      const r = await opts.block(id, !isBlocked);
      if (isBlocked) toast("Unbanned — can connect" + (r && r.unbannedIPs && r.unbannedIPs.length ? " (IPs: " + r.unbannedIPs.join(", ") + ")" : ""));
      else toast("Banned " + (r && r.until ? "until " + r.until : "(permanent)") + (r && r.bannedIPs && r.bannedIPs.length ? " + " + r.bannedIPs.length + " IP(s)" : (r && r.permanent ? " (no IP on record yet)" : "")));
      await open(id);
    } catch (e) { toast(e.message, true); }
  };
}

const tabs = {
  players: () => renderJsonEditor({
    label: "players", hint: "search name, Discord username, Discord ID or account ID...",
    search: q => api("/players?limit=100&q=" + encodeURIComponent(q)),
    id: r => r.accountID, row: r => `${r.displayName || "(no name)"} <span class="muted">${r.accountID}${r.discordUsername ? " · Discord: " + esc(r.discordUsername) : ""} · ${r.currency ?? "?"}c ${r.beans ?? "?"}b</span>`,
    load: id => api("/player/" + encodeURIComponent(id)),
    save: (id, o) => api("/player/" + encodeURIComponent(id), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(o) }),
    del: id => api("/player/" + encodeURIComponent(id), { method: "DELETE" }),
    kick: (id, reason) => api("/player/" + encodeURIComponent(id) + "/kick", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ reason }) }),
    devreset: id => api("/player/" + encodeURIComponent(id) + "/device-reset", { method: "POST" }),
    unlinkDiscord: id => api("/player/" + encodeURIComponent(id) + "/unlink-discord", { method: "POST" }),
    block: (id, blocked) => {
      if (!blocked) return api("/player/" + encodeURIComponent(id) + "/unban", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ alsoIP: true }) });
      const raw = prompt("Ban length — e.g. 2h, 3d, 7d, 1w — or leave BLANK for permanent (permanent also IP-bans):", "");
      if (raw === null) return Promise.reject(new Error("cancelled"));
      const h = parseDur(raw);
      if (h === null) return Promise.reject(new Error("Bad length — use e.g. 2h, 3d, 7d, or blank for permanent"));
      return api("/player/" + encodeURIComponent(id) + "/ban", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ alsoIP: true, durationHours: h }) });
    },
  }),
  /*@cut liveview*/
  // View (Photon owners): live 3D look at the bot's room, see players move/build and build there.
  // The page itself is /editor/view (static/editor_view.html); this tab just embeds it.
  liveview: () => {
    view.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <h2 style="margin:0">View</h2><a href="/editor/view" target="_blank" rel="noopener">open full screen</a></div>
      <iframe src="/editor/view" title="Live room view" allow="microphone; autoplay"
        style="width:100%;height:calc(100vh - 90px);min-height:420px;border:1px solid var(--line);border-radius:8px;background:var(--bg)"></iframe>`;
  },
  /*@end liveview*/
  extra: () => {
    const items = [
      ["settings", "Settings", "server toggles (creative, friends, versions)"],
      ["default", "Default", "the starter account every new player gets"],
      ["daily", "Daily", "card packs, rewards, daily config"],
      ["screens", "Screens", "in-game screen / picture images"],
      ["news", "News", "the news board text"],
      ["announce", "Announce", "broadcast a message to everyone online"],
      ["errors", "Errors", "player-reported errors"],
      ["logs", "Logs", "server + client logs"],
    ];
    view.innerHTML = `<p class="note">Less-used setup and tools. Pick one:</p>` +
      `<div id="extragrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px">` +
      items.map(([k, label, desc]) =>
        `<button class="go" data-ex="${k}" style="text-align:left;padding:12px;height:auto;white-space:normal">` +
        `<b>${label}</b><br><span class="muted" style="font-size:12px">${desc}</span></button>`).join("") +
      `</div>`;
    view.querySelectorAll("button[data-ex]").forEach(b => b.onclick = () => { tabs[b.dataset.ex](); view.scrollTop = 0; });
  },
  /*@cut roles*/
  roles: async () => {
    view.innerHTML = `<p class="note">Who has the special roles, on live and 1.31. Add other role names separated by commas.</p>
      <div class="row"><input type="text" id="rolesq" value="blaze,frost,frostpack" style="max-width:320px">
      <button class="go" id="rolesgo">Show</button></div><div id="rolesout">loading...</div>`;
    async function load() {
      const box = document.getElementById("rolesout");
      box.textContent = "loading...";
      let d; try { d = await api("/roles/holders?roles=" + encodeURIComponent(document.getElementById("rolesq").value)); }
      catch (e) { box.textContent = "Error: " + e.message; return; }
      box.innerHTML = Object.entries(d.roles).map(([role, hs]) =>
        `<h3>${esc(role)} <span class="muted">(${hs.length})</span></h3>` +
        (hs.length ? `<ul class="list">` + hs.map(h =>
          `<li class="bli"><div class="binfo"><div class="bname">${esc(h.name || "(no name)")}</div>` +
          `<div class="bmeta">${esc(h.accountID)}${h.discord ? " · Discord: " + esc(h.discord) : ""} · ${esc(h.servers.join(" + "))}</div></div>` +
          `<button class="blk" data-rmrole="${esc(role)}" data-rmacct="${esc(h.accountID)}">Remove</button></li>`
        ).join("") + `</ul>` : `<p class="muted">Nobody has this role.</p>`)
      ).join("");
      box.querySelectorAll("button[data-rmrole]").forEach(b => b.onclick = async () => {
        const role = b.dataset.rmrole, aid = b.dataset.rmacct;
        if (!confirm("Remove role '" + role + "' from " + aid + "?")) return;
        try {
          const r = await api("/roles/remove", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ accountID: aid, role }) });
          toast("Removed " + role + (r.autoGranted ? " — but it's auto-granted, comes back next login" : ""));
          load();
        } catch (e) { toast(e.message, true); }
      });
    }
    async function loadBuilders() {
      let box = document.getElementById("bldbox");
      if (!box) { box = document.createElement("div"); box.id = "bldbox"; view.insertBefore(box, view.firstChild); }
      let d; try { d = await api("/builders"); } catch (e) { box.textContent = "Error: " + e.message; return; }
      box.innerHTML = `<h3>Map builders</h3><p class="note">These players can switch normal maps to creative and their builds save ` +

      try { const r = await api("/map/" + encodeURIComponent(rk) + "/blocks",
              { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ blocks: arr }) });
            let roomMsg = "";
            if (mmRoom && document.getElementById("mmroomset").checked) {

              try {

                    body: JSON.stringify(Object.assign({ floorDepth: +mmRoom.floorDepth || 0, liquidType: +mmRoom.liquidType || 0, liquidLevel: +mmRoom.liquidLevel || 0 },

                  roomMsg = ", ground " + (+mmRoom.floorDepth || 0) + ", water " + (+mmRoom.liquidLevel || 0)

    const THEMES = ["suburb","beach","snow","desert","fantasy","backrooms","researchFacility","sandbox","tutorial"];

    async function openRoom(rk) {

          <div style="padding:10px 12px">

      document.getElementById("savesettings").onclick = async () => {

        toast(r.moved ? `Bot going to ${r.name}'s room - it starts mimicking once it's in`
                      : `Mimicking ${r.name}`);
      } catch (e) { toast(e.message, true); }
      setTimeout(status, 1200);
    }
    function onPicked(word) {
      const target = $("pbpl").value;
      if (!target) { toast("Pick a player in the list first", true); return; }
      send(word + " " + target);
    }
    view.querySelectorAll("button[data-cmd]").forEach(b => b.onclick = () => {
      const c = b.dataset.cmd;
      if (c === "@mimic") mimic();
      else if (c.startsWith("@")) onPicked(c.slice(1));
      else send(c);
    });
    $("pbsend").onclick = () => { const v = $("pbcmd").value.trim(); if (v) { send(v); $("pbcmd").value = ""; } };
    $("pbcmd").onkeydown = e => { if (e.key === "Enter") $("pbsend").click(); };
    $("pbref").onclick = players;
    $("pbhook").onclick = async () => {
      const target = $("pbpl").value;
      if (!target) { toast("Pick a player first", true); return; }
      $("pbhook").disabled = true; $("pbst").textContent = "starting (stopping the old one first can take a bit)...";
      try { await api("/photon/start", { method: "POST", headers: { "Content-Type": "application/json" },
                                         body: JSON.stringify({ target, stay: $("pbstay").checked }) });
            toast("Bot hooked on"); }
      catch (e) { toast(e.message, true); }
      $("pbhook").disabled = false; status();
    };
    $("pbstop").onclick = async () => {
      $("pbstop").disabled = true;   // avoid stacking stop requests on repeated clicks
      $("pbst").textContent = "stopping...";
      try { const r = await api("/photon/stop", { method: "POST" }); toast(r.was ? "Bot stopped" : "It wasn't running"); }
      catch (e) { toast(e.message, true); }
      const b = $("pbstop"); if (b) b.disabled = false;
      status();
    };
    clearInterval(tabs.photon._t);
    tabs.photon._t = setInterval(status, 3000);
    players(); status();
  },

  /*@end photon*/
  /*@cut talk*/
  // Live talk through the Photon bot: your mic plays at the hooked player's face,
  // and you hear everyone in their room. Drives the bot itself (/photon start+cmd).
  talk: async () => {
    view.innerHTML = `<p class="note">Talk to players live through the Photon bot. Pick a player and press
      <b>Start talking</b>: the bot joins their room (and follows them). Your voice plays right in front of
      that player's face, so they hear you clearly and people near them hear it too, and you hear everyone
      talking in the room. Use headphones so the players don't hear themselves back.</p>
      <div class="row">
        <select id="tkpl" style="min-width:260px"><option value="">loading players...</option></select>
        <button class="go" id="tkref">Refresh players</button>
        <button class="go" id="tkstart">Start talking</button>
        <button class="del" id="tkstop">Stop</button>
      </div>
      <div class="row"><b>Status:</b> <span id="tkst" class="muted"></span></div>
      <div class="row">
        <button id="tkptt" class="go" style="font-size:20px;padding:18px 30px;touch-action:none;user-select:none">Hold to talk</button>
        <label class="muted"><input type="checkbox" id="tkopen"> Mic always on</label>
        <span class="muted">(or hold Space)</span>
        <span>Mic <span id="tkmeter" style="display:inline-block;width:140px;height:10px;background:#8883;vertical-align:middle;border-radius:5px;overflow:hidden"><i style="display:block;height:100%;width:0;background:#3c9"></i></span></span>
      </div>
      <div class="row"><label>Players' volume <input type="range" id="tkvol" min="0" max="4" step="0.1"></label>
        <span>Players <span id="tkin" style="display:inline-block;width:140px;height:10px;background:#8883;vertical-align:middle;border-radius:5px;overflow:hidden"><i style="display:block;height:100%;width:0;background:#39f"></i></span></span></div>
      <div class="row"><b>Talking now:</b> <span id="tkspk" class="muted"></span></div>
      <div class="row"><label><input type="checkbox" id="tkstt"> Show what players say as text</label>
        <span id="tksttst" class="muted"></span></div>
      <pre class="smp" id="tklog" style="max-height:300px;overflow:auto;white-space:pre-wrap"></pre>`;
    const $ = id => document.getElementById(id);
    const T = TALK;
    $("tkvol").value = T.vol;
    $("tkopen").checked = T.open;
    async function players() {
      const sel = $("tkpl");
      try {
        const d = await api("/photon/players");
        const byRoom = {};
        d.players.forEach(p => (byRoom[p.roomName || p.roomKey || "?"] ||= []).push(p));
        sel.innerHTML = `<option value="">pick a player (${d.players.length} online)</option>` +
          Object.entries(byRoom).map(([room, ps]) => `<optgroup label="${esc(room)} (${ps.length})">${
            ps.map(p => `<option value="${esc(p.accountID)}"${p.accountID === T.target ? " selected" : ""}>${esc(p.name)}</option>`).join("")}</optgroup>`).join("");
      } catch (e) { sel.innerHTML = `<option value="">error: ${esc(e.message)}</option>`; }
    }
    $("tkref").onclick = players;
    $("tkstart").onclick = async () => {
      const target = $("tkpl").value;
      if (!target) { toast("Pick a player first", true); return; }
      $("tkstart").disabled = true;
      try { await talkStart(target); }
      catch (e) {
        const why = e && e.name === "NotAllowedError"
          ? "Microphone blocked. Click the lock icon next to the address, allow the microphone, then press Start talking again."
          : e && e.name === "NotFoundError" ? "No microphone found on this device."
          : (e && e.message) || String(e);
        talkStop(false); TALK.status = why; toast(why, true);
      }
      $("tkstart").disabled = false;
    };
    $("tkstop").onclick = () => talkStop(true);
    const ptt = $("tkptt");
    ptt.onpointerdown = e => { e.preventDefault(); T.held = true; ptt.setPointerCapture?.(e.pointerId); };
    ptt.onpointerup = ptt.onpointercancel = ptt.onlostpointercapture = () => { T.held = false; };
    $("tkopen").onchange = e => { T.open = e.target.checked; };
    $("tkvol").oninput = e => { T.vol = +e.target.value; if (T.gain) T.gain.gain.value = T.vol; };
    $("tkstt").checked = T.stt;
    $("tkstt").onchange = e => { T.stt = e.target.checked; if (T.stt) { T.sttState = T.asr ? "on" : "loads when someone talks"; talkRunJobs(); }
                                 else { T.seg = {}; T.jobs = []; T.sttState = ""; } };
    let shown = -1;
    clearInterval(tabs.talk._t);
    tabs.talk._t = setInterval(() => {
      if (!$("tkst")) { clearInterval(tabs.talk._t); return; }
      $("tkst").textContent = T.status;
      ptt.style.opacity = T.ws ? 1 : 0.5;
      ptt.textContent = talkLive() ? "Talking..." : "Hold to talk";
      $("tkmeter").firstElementChild.style.width = Math.min(100, Math.round(T.level * 400)) + "%";
      const now = performance.now();
      const on = Object.entries(T.heard).filter(([, t]) => now - t < 400).map(([k]) => T.names[k] || ("player " + k));
      $("tkspk").textContent = T.ws ? (on.length ? on.join(", ") : "nobody") : "";
      $("tkin").firstElementChild.style.width = Math.min(100, Math.round(T.inLevel * 400)) + "%";
      T.inLevel *= 0.7;
      $("tksttst").textContent = T.stt ? T.sttState : "";
      if (shown !== T.linesVer) {
        shown = T.linesVer;
        const box = $("tklog"), atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
        box.textContent = T.lines.join("\n") || (T.stt ? "(what players say shows up here)" : "");
        if (atEnd) box.scrollTop = box.scrollHeight;
      }
    }, 150);
    players();
  },
  /*@end talk*/
};

// ─── Live talk session (see tabs.talk) ──────────────────────────────────────
const TALK = { ws: null, ctx: null, stream: null, node: null, gain: null, target: "", status: "off",
               held: false, space: false, open: false, vol: 1.5, level: 0, names: {}, heard: {}, play: {},
               acc: new Int16Array(960), accN: 0, rs: { pos: 0, last: 0 },
               inLevel: 0, stt: false, sttState: "", asr: null, seg: {}, jobs: [], busy: false, lines: [], linesVer: 0 };
function talkLive() { return !!TALK.ws && (TALK.held || TALK.space || TALK.open); }
document.addEventListener("keydown", e => {
  if (e.code !== "Space" || !TALK.ws || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "")
      || !document.getElementById("tkptt")) return;
  e.preventDefault(); TALK.space = true;
});
document.addEventListener("keyup", e => { if (e.code === "Space") TALK.space = false; });

function talkMic(f32) {
  const T = TALK;
  let sum = 0;
  for (let i = 0; i < f32.length; i++) sum += f32[i] * f32[i];
  T.level = T.level * 0.6 + Math.sqrt(sum / f32.length) * 0.4;
  const ratio = T.ctx.sampleRate / 48000;
  const push = v => {
    const live = talkLive();
    T.acc[T.accN++] = live ? Math.max(-32768, Math.min(32767, Math.round(v * 32767))) : 0;
    if (T.accN === 960) {
      if (live && T.ws && T.ws.readyState === 1 && T.ws.bufferedAmount < 48000) T.ws.send(T.acc.slice(0).buffer);
      T.accN = 0;
    }
  };
  if (ratio === 1) { for (let i = 0; i < f32.length; i++) push(f32[i]); return; }
  let pos = T.rs.pos, last = T.rs.last;
  for (let i = 0; i < f32.length; i++) {
    const cur = f32[i];
    while (pos <= 1) { push(last + (cur - last) * pos); pos += ratio; }
    pos -= 1; last = cur;
  }
  T.rs.pos = pos; T.rs.last = last;
}

function talkHear(buf) {
  const T = TALK, u8 = new Uint8Array(buf);
  if (u8[0] !== 1 || !T.ctx) return;
  const who = u8[1] | (u8[2] << 8);
  const pcm = new Int16Array(buf.slice(3));
  if (!pcm.length) return;
  const ab = T.ctx.createBuffer(1, pcm.length, 24000), ch = ab.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
  const src = T.ctx.createBufferSource();
  src.buffer = ab; src.connect(T.gain);
  const now = T.ctx.currentTime;
  let at = T.play[who] || 0;
  if (at < now + 0.05 || at > now + 1.0) at = now + 0.12;
  src.start(at);
  T.play[who] = at + ab.duration;
  T.heard[who] = performance.now();
  let sum = 0;
  for (let i = 0; i < ch.length; i++) sum += ch[i] * ch[i];
  T.inLevel = Math.max(T.inLevel, Math.sqrt(sum / ch.length));
  if (T.stt) talkSeg(who, ch, Math.sqrt(sum / ch.length));
}

// What players say, as text (Whisper base.en via transformers.js, cached after first load).
const STT_LIB = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2/dist/transformers.min.js";
function talkSeg(who, f32, rms) {
  const T = TALK, now = performance.now();
  const s = T.seg[who] || (T.seg[who] = { parts: [], len: 0, voiced: 0, quiet: 0, last: now });
  const ms = f32.length / 24;
  s.last = now;
  if (rms > 0.015) { s.voiced += ms; s.quiet = 0; } else if (s.len) s.quiet += ms;
  if (rms > 0.015 || s.len) { s.parts.push(f32); s.len += f32.length; }
  if (s.len && (s.quiet >= 700 || s.len >= 24000 * 12)) talkSegEnd(who);
}
function talkSegEnd(who) {
  const T = TALK, s = T.seg[who];
  if (!s || !s.len) return;
  delete T.seg[who];
  if (s.voiced < 400) return;
  const all = new Float32Array(s.len);
  let o = 0;
  for (const p of s.parts) { all.set(p, o); o += p.length; }
  T.jobs.push({ name: T.names[who] || ("player " + who), audio: all, at: new Date() });
  talkRunJobs();
}
setInterval(() => {
  const now = performance.now();
  for (const who of Object.keys(TALK.seg)) if (now - TALK.seg[who].last > 800) talkSegEnd(who);
}, 300);
async function talkAsr() {
  const T = TALK;
  if (T.asr) return T.asr;
  T.sttState = "loading the speech model (about 80 MB the first time)...";
  const { pipeline } = await import(STT_LIB);
  T.asr = await pipeline("automatic-speech-recognition", "Xenova/whisper-base.en", { dtype: "q8" });
  T.sttState = "on";
  return T.asr;
}
async function talkRunJobs() {
  const T = TALK;
  if (T.busy || !T.jobs.length || !T.stt) return;
  T.busy = true;
  try {
    const asr = await talkAsr();
    while (T.jobs.length && T.stt) {
      if (T.jobs.length > 6) T.jobs.splice(0, T.jobs.length - 6);
      const j = T.jobs.shift();
      const n = Math.floor(j.audio.length * 2 / 3), a16 = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const x = i * 1.5, k = Math.floor(x), f = x - k;
        a16[i] = j.audio[k] * (1 - f) + (j.audio[k + 1] || 0) * f;
      }
      const r = await asr(a16);
      const text = String((r && r.text) || "").trim();
      if (!text || /^[\[(].*[\])]$/.test(text) || /^(thank you\.?|thanks for watching!?|you\.?|\.+)$/i.test(text)) continue;
      const hh = j.at.toTimeString().slice(0, 8);
      T.lines.push(`${hh}  ${j.name}: ${text}`);
      if (T.lines.length > 300) T.lines.splice(0, T.lines.length - 300);
      T.linesVer++;
    }
  } catch (e) { T.sttState = "speech to text failed: " + (e && e.message || e); }
  T.busy = false;
  if (T.jobs.length && T.stt) setTimeout(talkRunJobs, 50);
}

async function talkStart(target) {
  const T = TALK;
  if (T.ws) talkStop(false);
  T.target = target;
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    throw new Error("This browser can't use a microphone here. Open the editor in Chrome or Edge at https://live.your-domain.example/editor");
  T.status = "asking for your microphone...";
  T.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true,
                                                                autoGainControl: true, channelCount: 1 } });
  try { T.ctx = new AudioContext({ sampleRate: 48000 }); } catch (_) { T.ctx = new AudioContext(); }
  await T.ctx.resume();
  if (!T.ctx.audioWorklet) throw new Error("This browser can't record audio for live talk. Use Chrome or Edge.");
  T.status = "starting the bot...";
  const code = `class Cap extends AudioWorkletProcessor { process(inp) { const c = inp[0] && inp[0][0];
    if (c) this.port.postMessage(c.slice(0)); return true; } } registerProcessor("cap", Cap);`;
  await T.ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([code], { type: "application/javascript" })));
  T.node = new AudioWorkletNode(T.ctx, "cap");
  T.node.port.onmessage = e => talkMic(e.data);
  const mute = T.ctx.createGain(); mute.gain.value = 0;
  T.ctx.createMediaStreamSource(T.stream).connect(T.node);
  T.node.connect(mute); mute.connect(T.ctx.destination);
  T.gain = T.ctx.createGain(); T.gain.gain.value = T.vol; T.gain.connect(T.ctx.destination);
  T.rs = { pos: 0, last: 0 }; T.accN = 0; T.play = {}; T.heard = {}; T.names = {}; T.seg = {};
  const s = await api("/photon/status");
  if (!s.running || s.target !== target) {
    T.status = "hooking the bot onto the player...";
    await api("/photon/start", { method: "POST", headers: { "Content-Type": "application/json" },
                                 body: JSON.stringify({ target, stay: false }) });
  }
  await api("/photon/cmd", { method: "POST", headers: { "Content-Type": "application/json" },
                             body: JSON.stringify({ cmd: "talk" }) });
  T.status = "connecting...";
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + API + "/photon/talk");
  ws.binaryType = "arraybuffer";
  T.ws = ws;
  ws.onmessage = e => {
    if (typeof e.data !== "string") { talkHear(e.data); return; }
    try { const m = JSON.parse(e.data);
          if (m.type === "status") T.status = m.msg;
          else if (m.type === "speakers") T.names = m.names || {}; } catch (_) {}
  };
  ws.onclose = () => { if (T.ws === ws) { T.ws = null; T.status = "disconnected - press Start talking again"; } };
}

function talkStop(tellBot) {
  const T = TALK;
  const ws = T.ws; T.ws = null;
  try { ws && ws.close(); } catch (_) {}
  try { T.stream && T.stream.getTracks().forEach(t => t.stop()); } catch (_) {}
  try { T.ctx && T.ctx.close(); } catch (_) {}
  T.stream = T.ctx = T.node = T.gain = null; T.level = 0; T.status = "off";
  if (tellBot) api("/photon/cmd", { method: "POST", headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({ cmd: "talk off" }) }).catch(() => {});
}

// Version switch (bottom left): 1.31.0 and 2.31.0-blaze each have their own editor
// server (same editor code, separate sign-in). Full URLs, so it works from both.
document.querySelectorAll("aside button[data-t]").forEach(b => b.onclick = () => {
  document.querySelectorAll("aside button[data-t]").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); tabs[b.dataset.t]();
});

(async () => {
  try { const me = await api("/me");
        IS_ADMIN = !!me.roleAdmin;
        IS_MOD = !!me.canBan;
        document.getElementById("who").textContent = "signed in as " + me.name;
        if (me.roleAdmin) document.getElementById("tab-roles").style.display = "";   // editor admins only
        if (me.photon) { document.getElementById("tab-photon").style.display = "";   // reveal Photon + Talk + View
                         document.getElementById("tab-talk").style.display = ""; }
        if (me.view) document.getElementById("tab-liveview").style.display = "";      // owner only
        // owner only: the current editor code (it isn't posted anywhere any more)
        try { await api("/editor_code");      // owner only: click to view (hidden for screen sharing)
              const who = document.getElementById("who");
              const b = document.createElement("button");
              b.textContent = "show editor code"; b.style.marginLeft = "8px"; b.style.fontSize = "12px";
              let t = null;
              b.onclick = async () => {
                if (b.dataset.on) { b.textContent = "show editor code"; delete b.dataset.on; clearTimeout(t); return; }
                try { const c = await api("/editor_code");
                      b.textContent = "editor code " + c.code + " (changes in " + c.minutesLeft + " min) - click to hide";
                      b.dataset.on = "1";
                      t = setTimeout(() => { b.textContent = "show editor code"; delete b.dataset.on; }, 20000); } catch (_) {}
              };
              who.after(b); } catch (_) {} }
  catch (e) { return; }
  tabs.players();
})();
